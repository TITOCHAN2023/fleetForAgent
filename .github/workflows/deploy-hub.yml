name: Deploy hosted hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/fleet-worker/**"
      - "packages/fleet-tool/**"
      - ".github/workflows/deploy-hub.yml"

permissions:
  contents: read

concurrency:
  group: deploy-hub
  cancel-in-progress: false

env:
  NODE_VERSION: "22.22.0"

jobs:
  verify:
    name: Verify the deployment commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/fleet-worker
      - run: npm test
      - run: npm run typecheck

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment: production
    name: Bake commit and deploy Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact commit that will be advertised
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked Worker dependencies
        run: npm ci --prefix packages/fleet-worker

      - name: Bundle Worker and hash the script
        working-directory: packages/fleet-worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          out="$RUNNER_TEMP/fleet-worker-bundle"
          npm exec -- wrangler deploy --dry-run --outdir "$out"
          mapfile -t scripts < <(find "$out" -maxdepth 1 -type f -name '*.js' ! -name '*.map' | sort)
          test "${#scripts[@]}" -eq 1
          sha256sum "${scripts[0]}" | awk '{print $1}' > "$RUNNER_TEMP/fleet-worker-bundle.sha256"
          test "$(wc -c < "$RUNNER_TEMP/fleet-worker-bundle.sha256")" -eq 65
          echo "SOURCE_BUNDLE_SHA256=$(cat "$RUNNER_TEMP/fleet-worker-bundle.sha256")" >> "$GITHUB_ENV"
          echo "SOURCE_BUNDLE_PATH=${scripts[0]}" >> "$GITHUB_ENV"

      - name: Prepare downloadable build evidence
        run: |
          evidence="$RUNNER_TEMP/hub-evidence"
          mkdir -p "$evidence"
          cp "$SOURCE_BUNDLE_PATH" "$evidence/worker.js"
          cp packages/fleet-worker/wrangler.toml "$evidence/wrangler.toml"
          node -e '
            const e = process.env;
            console.log(JSON.stringify({
              schema_version: 1, repository: e.GITHUB_REPOSITORY, source_commit: e.GITHUB_SHA,
              workflow_run: `https://github.com/${e.GITHUB_REPOSITORY}/actions/runs/${e.GITHUB_RUN_ID}/attempts/${e.GITHUB_RUN_ATTEMPT}`,
              worker_sha256: e.SOURCE_BUNDLE_SHA256,
              scope: "Worker JavaScript and repository config; excludes static assets, secrets and live runtime",
              status: "built; check the deploy step separately"
            }, null, 2));
          ' > "$evidence/receipt.json"
          (cd "$evidence" && sha256sum worker.js wrangler.toml receipt.json > checksums.txt)
          tar -czf "$RUNNER_TEMP/hub-evidence.tar.gz" -C "$evidence" .

      - name: Attest the Worker bundle and evidence archive this job built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ env.SOURCE_BUNDLE_PATH }}
            ${{ runner.temp }}/hub-evidence.tar.gz

      - name: Publish build evidence before deploying
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hub-evidence.tar.gz
          if-no-files-found: error
          retention-days: 90

      - name: Deploy the attested script with SOURCE_COMMIT=$GITHUB_SHA
        working-directory: packages/fleet-worker
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "CLOUDFLARE_API_TOKEN must live as a GitHub Actions secret, not on a laptop." >&2
            exit 1
          }
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          echo "$SOURCE_BUNDLE_SHA256  $SOURCE_BUNDLE_PATH" | sha256sum --check --status
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          vars=(
            --var "SOURCE_COMMIT:${GITHUB_SHA}"
            --var "SOURCE_REPO:https://github.com/TITOCHAN2023/fleetForAgent"
            --var "SOURCE_WORKFLOW_RUN:${run_url}"
            --var "SOURCE_BUNDLE_SHA256:${SOURCE_BUNDLE_SHA256}"
          )
          if [ -n "$tag" ]; then
            vars+=(--var "SOURCE_TAG:${tag}")
          fi
          # Do not keep dashboard vars. A laptop wrangler deploy without these
          # --var flags must drop SOURCE_COMMIT so /source.verified becomes false.
          npm exec -- wrangler deploy "$SOURCE_BUNDLE_PATH" --no-bundle "${vars[@]}"

      - name: Link the build evidence and deployment result
        if: always()
        env:
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Hub release evidence"
            echo "Commit: $GITHUB_SHA"
            echo "Job status: $DEPLOY_JOB_STATUS (inspect the deploy step for the upload result)."
            echo "Build evidence: $EVIDENCE_URL"
            echo "Artifacts expire after 90 days and downloading requires GitHub login."
            echo "Build provenance is not proof of the live runtime or an independent audit."
          } >> "$GITHUB_STEP_SUMMARY"
