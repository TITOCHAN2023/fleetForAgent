name: Windows plugin process tree

on:
  push:
    branches:
      - main
      - codex/file-transfer-plugin
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-plugin-process-tree:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.0"
          cache-dependency-path: |
            packages/fleet-agent/go.sum
            packages/fleet-tool/windows-job-host/go.sum

      - name: Test Agent Windows process ownership
        working-directory: packages/fleet-agent
        run: go test ./...

      - name: Test Tool Windows Job host and cancellation
        run: node --test packages/fleet-tool/plugin-peer-plugin.test.mjs

      - name: Vet Windows Job host
        working-directory: packages/fleet-tool/windows-job-host
        run: go vet ./...

      - name: Rebuild and verify the published Tool archive
        env:
          npm_config_cache: ${{ runner.temp }}\npm-cache
        run: node --test packages/fleet-worker/fleet-tool-tgz.test.mjs
