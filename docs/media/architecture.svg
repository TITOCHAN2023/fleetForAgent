<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Fleet: one MCP tool talks to fleet.ginfo.cc, which fans out over WebSocket to Windows, Linux, and macOS agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#122033"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <text x="40" y="42" fill="#3ee0c5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">FLEET.GINFO.CC</text>
  <text x="640" y="44" text-anchor="middle" fill="#eef3ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">One tool. Windows + Linux + macOS. Anywhere.</text>

  <rect x="36" y="220" width="250" height="200" rx="20" fill="#101826" stroke="#f0c14a" stroke-width="2"/>
  <text x="56" y="258" fill="#f0c14a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">TOOL</text>
  <text x="56" y="300" fill="#eef3ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">Cursor / Claude</text>
  <text x="56" y="332" fill="#8b97ad" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">MCP operator</text>
  <text x="56" y="390" fill="#8b97ad" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">URL + token</text>

  <line x1="286" y1="320" x2="430" y2="320" stroke="#f0c14a" stroke-width="3"/>
  <polygon points="430,314 444,320 430,326" fill="#3ee0c5"/>
  <text x="358" y="306" text-anchor="middle" fill="#f0c14a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">HTTPS</text>

  <rect x="444" y="200" width="280" height="240" rx="20" fill="#101826" stroke="#3ee0c5" stroke-width="2"/>
  <text x="464" y="242" fill="#3ee0c5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SERVER</text>
  <text x="464" y="286" fill="#eef3ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">fleet.ginfo.cc</text>
  <text x="464" y="318" fill="#8b97ad" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Cloud hub</text>
  <text x="464" y="400" fill="#8b97ad" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">WSS /v1/device</text>

  <line x1="724" y1="250" x2="860" y2="140" stroke="#6ea8ff" stroke-width="2"/>
  <line x1="724" y1="320" x2="860" y2="320" stroke="#3ee0c5" stroke-width="2"/>
  <line x1="724" y1="390" x2="860" y2="500" stroke="#ff7b8a" stroke-width="2"/>

  <rect x="860" y="70" width="380" height="120" rx="18" fill="#101826" stroke="#6ea8ff" stroke-width="2"/>
  <text x="880" y="108" fill="#6ea8ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">WINDOWS</text>
  <text x="880" y="148" fill="#eef3ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">amd64 Agent</text>
  <text x="880" y="172" fill="#8b97ad" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">outbound WebSocket</text>

  <rect x="860" y="250" width="380" height="120" rx="18" fill="#101826" stroke="#3ee0c5" stroke-width="2"/>
  <text x="880" y="288" fill="#3ee0c5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">LINUX</text>
  <text x="880" y="328" fill="#eef3ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">amd64 / arm64 Agent</text>
  <text x="880" y="352" fill="#8b97ad" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">outbound WebSocket</text>

  <rect x="860" y="430" width="380" height="120" rx="18" fill="#101826" stroke="#ff7b8a" stroke-width="2"/>
  <text x="880" y="468" fill="#ff7b8a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">MACOS</text>
  <text x="880" y="508" fill="#eef3ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800">arm64 / amd64 Agent</text>
  <text x="880" y="532" fill="#8b97ad" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">outbound WebSocket</text>

  <rect x="70" y="560" width="1140" height="52" rx="14" fill="#0c1422" stroke="#1e2d44"/>
  <text x="640" y="594" text-anchor="middle" fill="#c5d0e0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Import the tool with this URL + token. Every Agent that dialed out is reachable from anywhere.</text>
</svg>
