      }
      function githubMark() {
        return `<a class="gh" href="https://github.com/TITOCHAN2023/fleetForAgent" target="_blank" rel="noreferrer" title="Star on GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg></a>`;
      }
      function langBar() {
        return `<div class="seg" role="group" aria-label="Language">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" data-loc="en" class="${state.locale==="en"?"on":""}">EN</button>
          <button type="button" data-loc="zh" class="${state.locale==="zh"?"on":""}">中文</button>
        </div>`;
      }
      function themeBar() {
        const p = state.themePref;
        return `<div class="seg" role="group" aria-label="Theme">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" data-theme-set="light" class="${p==="light"?"on":""}">${t("themeL")}</button>
          <button type="button" data-theme-set="dark" class="${p==="dark"?"on":""}">${t("themeD")}</button>
          <button type="button" data-theme-set="system" class="${p==="system"?"on":""}">${t("themeS")}</button>
        </div>`;
      }
      function syncSegments() {
        document.querySelectorAll(".seg").forEach((seg) => {
          const active = seg.querySelector("button.on") || seg.querySelector("button");
          if (!active) return;
          const s = seg.getBoundingClientRect();
          const b = active.getBoundingClientRect();
          seg.style.setProperty("--seg-x", (b.left - s.left) + "px");
          seg.style.setProperty("--seg-w", b.width + "px");
        });
      }
      function chrome(extra) {
        return `<header class="top">
          <a class="brand" href="/" data-go="/"><img src="/logo.png" width="28" height="28" alt="" />Fleet</a>
          <a class="nav-link" href="/help" data-go="/help">${t("help")}</a>
          <span class="spacer"></span>
          ${extra || ""}
          ${themeBar()}
          ${langBar()}
          ${githubMark()}
        </header>`;
      }
      function fan() {
        return `<div class="fan">
          <article class="node"><div class="k">${t("tool")}</div><h3 style="margin-top:8px">${t("toolTitle")}</h3><p class="muted" style="margin:6px 0 0">${t("toolSub")}</p></article>
          <div class="arrow">→</div>
          <article class="node"><div class="k">${t("server")}</div><h3 style="margin-top:8px">fleet.ginfo.cc</h3><p class="muted" style="margin:6px 0 0">${t("serverSub")}</p></article>
          <div class="arrow">→</div>
          <div class="os">
            <article class="node"><div class="k">Windows</div><p style="margin:6px 0 0;font-weight:500">amd64</p></article>
            <article class="node"><div class="k">Linux</div><p style="margin:6px 0 0;font-weight:500">amd64 / arm64</p></article>
            <article class="node"><div class="k">macOS</div><p style="margin:6px 0 0;font-weight:500">arm64 / amd64</p></article>
          </div>
        </div>`;
      }
      function keys() {
        const items = [["k1t","k1s"],["k2t","k2s"],["k3t","k3s"],["k4t","k4s"]];
        return `<div class="grid-4">${items.map(([a,b],i)=>`<article class="card"><p class="subtle">0${i+1}</p><h3 style="margin-top:12px">${t(a)}</h3><p class="muted" style="margin-top:6px">${t(b)}</p></article>`).join("")}</div>`;
      }
      function b64urlJson(s) {
        try {
          const t = String(s || "").replace(/-/g, "+").replace(/_/g, "/");
          const pad = t.length % 4 === 0 ? "" : "=".repeat(4 - (t.length % 4));
          return JSON.parse(atob(t + pad));
        } catch { return null; }
      }
      function inspectToken(raw) {
        const tkn = String(raw || "").trim();
        if (!tkn.startsWith("flt_1.")) return null;
        const rest = tkn.slice(6);
        const dot = rest.lastIndexOf(".");
        if (dot < 1) return null;
        const obj = b64urlJson(rest.slice(0, dot));
        if (!obj || obj.v !== 1 || !obj.aud || !obj.kid) return null;
        return { prefix: "flt_1.", aud: obj.aud, kid: obj.kid, iat: obj.iat, sig: rest.slice(dot + 1).slice(0, 12) };
      }
      function anatomyHtml(raw) {
        const view = inspectToken(raw);
        if (!view) return "";
        const issued = view.iat ? new Date(view.iat).toISOString() : "";
        const rows = [
          [t("anatomyPrefix"), view.prefix],
          [t("anatomyAud"), view.aud],
          [t("anatomyKid"), view.kid],
          [t("anatomyIat"), issued],
          [t("anatomySig"), view.sig + "…"],
        ];
        return `<div><p style="font-weight:600;margin:0 0 8px">${t("anatomy")}</p>${rows.map(([k,v]) => `<div class="kv"><span class="subtle">${esc(k)}</span><span>${esc(v)}</span></div>`).join("")}<p class="subtle" style="margin:8px 0 0">${t("anatomyRsa")}</p></div>`;
      }
      function promptView() {
        if (!state.prompt) return "";
        let inner = "";
        if (state.prompt === "confirm") {
          inner = `<h3>${t("resetConfirm")}</h3><p class="muted">${t("resetConfirmBody")}</p>
            <div class="row" style="justify-content:flex-end"><button class="btn" data-prompt="close">${t("promptCancel")}</button><button class="btn danger" data-prompt="mint">${t("promptContinue")}</button></div>`;
        } else if (state.prompt === "busy") {
          inner = `<p class="muted">${t("minting")}</p>`;
        } else if (state.prompt === "shown" && state.secret) {
          inner = `<p class="warn">${t("secretOnce")}</p><div class="secret"><code class="box">${esc(state.secret)}</code><button class="btn" type="button" data-copy-secret="1">${t("copy")}</button></div>
            ${anatomyHtml(state.secret)}
            <div class="row" style="justify-content:flex-end"><button class="btn primary" data-prompt="close">${t("promptClose")}</button></div>`;
        }
        return `<div class="shade" data-prompt="shade"><div class="prompt" role="dialog" aria-modal="true">${inner}</div></div>`;
      }
      function homeView() {
        return `${chrome()}
          <div class="wrap">
            <p class="kicker">${t("kicker")}</p>
            <h1>${t("hero")}</h1>
            <p class="lead">${t("body")}</p>
            <div class="stack">
              <p class="err">${state.err}</p>
              <a class="btn primary" href="/v1/auth/google">${t("continueG")}</a>
              <a class="btn" href="/v1/auth/x">${t("continueX")}</a>
              <a class="nav-link" href="/help" data-go="/help" style="text-align:center">${t("help")} →</a>
            </div>
            <h2 style="margin-top:72px">${t("archTitle")}</h2>
            <p class="muted" style="margin:8px 0 20px;max-width:40em">${t("archHint")}</p>
            ${fan()}
            <h2 style="margin-top:64px">${t("keysTitle")}</h2>
            <div style="margin-top:20px">${keys()}</div>
          </div>`;
      }
      function helpView(inApp) {
        const origin = location.origin;
        const extra = inApp ? `<nav class="tabs">
            <button class="tab" data-tab="fleet">${t("fleet")}</button>
            <button class="tab" data-tab="downloads">${t("downloads")}</button>
            <button class="tab on">${t("help")}</button>
            <button class="tab" data-tab="settings">${t("settings")}</button>
          </nav>
          <span class="who">${state.user ? state.user.email : ""}</span>
          <button class="btn ghost" id="out">${t("signOut")}</button>` : "";
        return `${chrome(extra)}
          <div class="wrap help">
            <p class="kicker">${t("kicker")}</p>
            <h1>${t("helpTitle")}</h1>
            <p class="lead">${t("helpLead")}</p>
            <h2>${t("archTitle")}</h2>
            <p class="muted" style="margin:8px 0 20px">${t("archHint")}</p>
            ${fan()}
            <h2>${t("s1")}</h2>
            <p class="muted">${t("s1b")}</p>
            <h2>${t("s2")}</h2>
            <p class="muted">${t("s2b")}</p>
            <p class="muted"><a class="nav-link" href="${GH.replace("/download","")}">GitHub Releases</a></p>
            <h2>${t("s3")}</h2>
            <p class="muted">${t("s3b")}</p>
            <pre>FLEET_URL=${origin}
FLEET_TOKEN=flt_1.…
node packages/fleet-tool/index.mjs list</pre>
            <h2>${t("s4")}</h2>
            <p class="muted">${t("keysTitle")}</p>
            <div style="margin-top:16px">${keys()}</div>
          </div>`;
      }
      function appView() {
        const tabs = [["fleet", t("fleet")], ["downloads", t("downloads")], ["help", t("help")], ["settings", t("settings")]];
        return `${chrome(`<nav class="tabs">${tabs.map(([id, label]) => `<button class="tab${state.tab===id?" on":""}" data-tab="${id}">${label}</button>`).join("")}</nav>
            <span class="who">${state.user.email}</span>
            <button class="btn ghost" id="out">${t("signOut")}</button>`)}
          <div class="page">${state.tab === "downloads" ? downloadsView() : state.tab === "fleet" ? fleetView() : state.tab === "help" ? helpInner() : settingsView()}</div>`;
      }
      function helpInner() {
        const origin = location.origin;
        return `<section class="card"><h3>${t("helpTitle")}</h3><p class="muted" style="margin-top:8px">${t("helpLead")}</p></section>
          ${fan()}
          <section class="card">
            <h3>${t("s1")}</h3><p class="muted" style="margin-top:8px">${t("s1b")}</p>
            <h3 style="margin-top:20px">${t("s2")}</h3><p class="muted" style="margin-top:8px">${t("s2b")}</p>
            <h3 style="margin-top:20px">${t("s3")}</h3><p class="muted" style="margin-top:8px">${t("s3b")}</p>
            <pre style="margin-top:12px">FLEET_URL=${origin}
FLEET_TOKEN=flt_1.…
node packages/fleet-tool/index.mjs list</pre>
          </section>`;
      }
      function settingsView() {
        const origin = location.origin;
        const shown = state.secret
          ? `<p class="warn">${t("secretOnce")}</p><div class="secret"><code class="box">${esc(state.secret)}</code><button class="btn" type="button" data-copy-secret="1">${t("copy")}</button></div>`
          : `<p class="muted" style="font-family:var(--mono)">${state.meta && state.meta.hasToken ? (state.meta.prefix + "…") : t("none")}</p>`;
        return `<section class="card">
          <h3>${t("hubTitle")}</h3>
          <p class="muted" style="margin-top:8px">${t("hubBody")}</p>
          <div style="margin-top:16px;display:grid;gap:12px">
            <div>
              <div class="subtle">${t("url")}</div>
              <div class="row" style="margin-top:6px"><code class="box" style="flex:1">${origin}</code><button class="btn" data-copy="${origin}">${t("copy")}</button></div>
            </div>
            <div>
              <div class="subtle">${t("token")}</div>
              <div style="margin-top:6px">${shown}</div>
            </div>
          </div>
          <div class="row" style="margin-top:16px">
            <button class="btn primary" id="mint"${state.metaReady ? "" : " disabled"}>${state.meta && state.meta.hasToken ? t("reset") : t("generate")}</button>
            ${state.meta && state.meta.hasToken ? `<span class="subtle">${t("resetHint")}</span>` : ""}
          </div>
          <p class="muted" style="margin-top:16px">${t("toolHint")}</p>
          <pre style="margin-top:8px">FLEET_URL=${origin}
FLEET_TOKEN=flt_1.…
node packages/fleet-tool/index.mjs list</pre>
        </section>`;
      }
      function downloadsView() {
        const items = [
          [t("win"), "FleetAgent-windows-amd64.exe"],
          [t("winArm"), "FleetAgent-windows-arm64.exe"],
          [t("macArm"), "FleetAgent-macos-arm64.dmg"],
          [t("macArmZip"), "FleetAgent-macos-arm64.zip"],
          [t("macIntel"), "FleetAgent-macos-amd64.dmg"],
          [t("macIntelZip"), "FleetAgent-macos-amd64.zip"],
          [t("linux"), "fleet-agent-linux-amd64.tar.gz"],
          [t("linuxArm"), "fleet-agent-linux-arm64.tar.gz"],
          [t("checksums"), "checksums-0.2.10.txt"],
        ];
        return `<section class="card">
          <h3>${t("relTitle")}</h3>
          <p class="muted" style="margin-top:8px">${t("relBody")}</p>
        </section>
        <div class="dl">${items.map(([name, file]) => `<article class="card"><h3>${name}</h3><p class="subtle" style="margin-top:8px;font-family:var(--mono)">${file}</p><a class="btn" style="margin-top:12px" href="${GH}/${file}">Download</a></article>`).join("")}</div>`;
      }
      function fleetView() {
        if (!state.computers.length) return `<section class="card"><h3>${t("fleet")}</h3><p class="muted" style="margin-top:8px">${t("empty")}</p></section>`;
        return `<section class="card"><h3>${t("fleet")}</h3>
          <div style="margin-top:16px;display:grid;gap:10px">${state.computers.map((c) => `
            <div class="machine row" style="justify-content:space-between">
              <div><strong>${c.name || c.id}</strong><div class="subtle" style="font-family:var(--mono)">${c.id} · ${c.os || ""}</div></div>
              <span class="muted"><span class="dot${c.online ? " on" : ""}"></span> ${c.online ? t("online") : t("offline")}</span>
            </div>`).join("")}</div>
        </section>`;
      }
      function render() {
        document.documentElement.lang = state.locale === "zh" ? "zh-CN" : "en";
        var root = document.getElementById("app");
        if (isHelp()) root.innerHTML = helpView(signedIn());
        else if (signedIn()) root.innerHTML = appView();
        else root.innerHTML = homeView();
        root.insertAdjacentHTML("beforeend", promptView());
        bind();
      }
      function bind() {
        document.querySelectorAll("[data-loc]").forEach((b) => b.onclick = () => {
          state.locale = b.dataset.loc; localStorage.setItem("fleet-locale", state.locale); render();
        });
        document.querySelectorAll("[data-theme-set]").forEach((b) => b.onclick = () => {
          applyTheme(b.dataset.themeSet);
          document.querySelectorAll("[data-theme-set]").forEach((x) => x.classList.toggle("on", x.dataset.themeSet === state.themePref));
          syncSegments();
        });
        document.querySelectorAll("[data-go]").forEach((b) => b.onclick = (e) => {
          e.preventDefault();
          if (b.dataset.go === "/help") go("/help");
          else go("/");
        });
        document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => {
          if (b.dataset.tab === "help") { state.tab = "help"; go("/help"); return; }
          if (isHelp()) history.pushState({}, "", "/");
          state.tab = b.dataset.tab; render();
        });
        const out = $("#out");
        if (out) out.onclick = async () => { try { await api("/v1/logout", { method: "POST", body: "{}" }); } catch {} state.user = null; state.secret = ""; go("/"); };
        const mint = $("#mint");
        if (mint) mint.onclick = () => {
          if (state.meta && state.meta.hasToken) { state.prompt = "confirm"; render(); return; }
          void mintToken();
        };
        document.querySelectorAll("[data-prompt]").forEach((b) => {
          b.onclick = (e) => {
            const act = b.dataset.prompt;
            if (act === "shade" && e.target !== b) return;
            if (act === "close" || act === "shade") { state.prompt = null; render(); return; }
            if (act === "mint") void mintToken();
          };
        });
        document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => navigator.clipboard.writeText(b.dataset.copy));
        document.querySelectorAll("[data-copy-secret]").forEach((b) => b.onclick = () => { if (state.secret) navigator.clipboard.writeText(state.secret); });
        requestAnimationFrame(syncSegments);
      }
      window.addEventListener("popstate", render);
      window.addEventListener("resize", syncSegments);
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (state.themePref === "system") { applyTheme("system"); syncSegments(); }
      });
      boot();
    </script>
  </body>
</html>
