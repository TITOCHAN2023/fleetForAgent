name = "fleet-hub"
main = "src/index.ts"
compatibility_date = "2026-04-07"
workers_dev = false

# Optional shared token. Leave unset for a first bring-up, then:
#   npx wrangler secret put HUB_TOKEN
# [vars] must not hold the token.
#
# Optional cookie-session ops emails (not HUB_TOKEN / Fleet-OAEP). Empty = no admins:
#   npx wrangler secret put ADMIN_EMAILS
# [vars] must not hold emails.
#
# When shipping an agent release (code-only; do not add a Durable Object
# migration): set LATEST_AGENT_VER to the tag (e.g. 0.3.2). Clients learn
# it from hello_ok / pong / /v1/health and pull OS/arch assets from
# AGENT_UPDATE_BASE (default GitHub releases/latest/download) plus
# checksums-{ver}.txt. Optional AGENT_UPDATE_CHECKSUMS / AGENT_UPDATE_SUMS
# override the checksums URL or inline the checksums.txt body.
#   npx wrangler secret put LATEST_AGENT_VER
#
# aud inside every flt_1 token. Never taken from the Host header.
[vars]
HUB_ORIGIN = "https://fleet.ginfo.cc"

[[routes]]
pattern = "fleet.ginfo.cc"
custom_domain = true

# Site UI is static assets. Hub wire stays on /v1/*.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceDO"

[[durable_objects.bindings]]
name = "FLEET"
class_name = "FleetDO"

[[durable_objects.bindings]]
name = "MCP"
class_name = "McpDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceDO", "FleetDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["McpDO"]
